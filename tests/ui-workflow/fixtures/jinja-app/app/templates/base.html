<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}العروض{% endblock %}</title>
  <style>
    :root { --ink: #1b1b1f; --line: #e3e3e8; --acc: #2457c5; --r: 12px; }
    .card { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-block-end: 12px; }
    {% block css %}{% endblock %}
  </style>
</head>
<body>
  <nav><a href="/offers" {% if nav == 'offers' %}aria-current="page"{% endif %}>العروض</a></nav>
  <main>{% block main %}{% endblock %}</main>
  <script src="/static/app.js" defer></script>
</body>
</html>
