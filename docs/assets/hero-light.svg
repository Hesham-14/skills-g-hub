<title id="t">skills-g-hub: from idea to verified change</title>
<desc id="d">Six stages light up in order: settle the plan with grill-me-code, write the spec with to-spec, split tickets with to-tickets, build with tdd or authorized delegates, review with the guard skills, and end with a verified result you decide what to do with.</desc>
